name: _build_and_test

on:
  workflow_call:

jobs:
  meson-build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64) - GCC
          - name: ubuntu-x64-gcc
            runs_on: ubuntu-24.04
            os: linux
            arch: x64
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux (x86_64) - Clang
          - name: ubuntu-x64-clang
            runs_on: ubuntu-24.04
            os: linux
            arch: x64
            compiler: clang
            cc: clang
            cxx: clang++

          # Linux (ARM64) - GCC (GitHub-hosted ARM runners are in public preview.)
          - name: ubuntu-arm64-gcc
            runs_on: ubuntu-24.04-arm
            os: linux
            arch: arm64
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux (ARM64) - Clang
          - name: ubuntu-arm64-clang
            runs_on: ubuntu-24.04-arm
            os: linux
            arch: arm64
            compiler: clang
            cc: clang
            cxx: clang++

          # macOS (x86_64) - AppleClang
          # - name: macos-x64-appleclang
          #   runs_on: macos-15-intel
          #   os: macos
          #   arch: x64
          #   compiler: appleclang
          #   cc: clang
          #   cxx: clang++

          # macOS (x86_64) - Homebrew LLVM Clang
          - name: macos-x64-llvm
            runs_on: macos-15-intel
            os: macos
            arch: x64
            compiler: llvm
            cc: llvm
            cxx: llvm

          # macOS (ARM64, Apple Silicon) - AppleClang
          # - name: macos-arm64-appleclang
          #   runs_on: macos-latest
          #   os: macos
          #   arch: arm64
          #   compiler: appleclang
          #   cc: clang
          #   cxx: clang++

          # macOS (ARM64, Apple Silicon) - Homebrew LLVM Clang
          - name: macos-arm64-llvm
            runs_on: macos-latest
            os: macos
            arch: arm64
            compiler: llvm
            cc: llvm
            cxx: llvm

          # Windows (x86_64) - MSVC (cl)
          - name: windows-x64-msvc
            runs_on: windows-2022
            os: windows
            arch: x64
            compiler: msvc
            cc: ""
            cxx: ""

          # Windows (x86_64) - clang-cl
          # - name: windows-x64-clangcl
          #   runs_on: windows-2022
          #   os: windows
          #   arch: x64
          #   compiler: clang-cl
          #   cc: clang-cl
          #   cxx: clang-cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja (pip)
        run: python -m pip install --upgrade pip && python -m pip install meson ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtest-dev \
            libgl1-mesa-dev libglfw3-dev
          # Ubuntu ships googletest sources via libgtest-dev; build & install libs.
          if [ -d "/usr/src/googletest" ]; then
            GTEST_SRC="/usr/src/googletest"
          else
            GTEST_SRC="/usr/src/gtest"
          fi
          sudo cmake -S "$GTEST_SRC" -B /tmp/gtest-build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/gtest-build --target install -j2
          sudo ldconfig

      - name: Install Clang (Linux, clang builds)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          # Install clang-20 for full C++23 support including std::expected
          # Add LLVM official repository for latest versions
          # Ubuntu 24.04 is "noble", but LLVM repo uses codename
          wget -O /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo cp /tmp/llvm-snapshot.gpg.key /etc/apt/trusted.gpg.d/llvm-snapshot.asc
          # Try noble first (Ubuntu 24.04), fallback to jammy if not available
          if echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/llvm.list 2>/dev/null; then
            echo "deb-src http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee -a /etc/apt/sources.list.d/llvm.list
            REPO_CODENAME="noble"
          else
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy main" | sudo tee /etc/apt/sources.list.d/llvm.list
            echo "deb-src http://apt.llvm.org/jammy/ llvm-toolchain-jammy main" | sudo tee -a /etc/apt/sources.list.d/llvm.list
            REPO_CODENAME="jammy"
          fi
          sudo apt-get update
          # Check available clang versions
          echo "=== Available clang versions ==="
          apt-cache search clang- | grep "^clang-[0-9]" | head -10 || true
          # Try to install clang-20 first, then fallback to newer versions
          INSTALLED_VERSION=""
          if apt-cache show clang-20 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-20; then
            INSTALLED_VERSION="20"
            echo "✓ Installed clang-20"
          elif apt-cache show clang-19 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-19; then
            INSTALLED_VERSION="19"
            echo "✓ Installed clang-19 (clang-20 not available)"
          elif apt-cache show clang-18 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-18; then
            INSTALLED_VERSION="18"
            echo "⚠ Installed clang-18 (clang-20 not available)"
          elif apt-cache show clang-17 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-17; then
            INSTALLED_VERSION="17"
            echo "⚠ Installed clang-17 (clang-20 not available)"
          elif apt-cache show clang-16 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-16; then
            INSTALLED_VERSION="16"
            echo "⚠ Installed clang-16 (clang-20 not available)"
          else
            # Fallback to default clang (may not support std::expected)
            sudo apt-get install -y --no-install-recommends clang
            INSTALLED_VERSION="default"
            echo "⚠ Installed default clang (clang-20 not available)"
          fi
          # Set alternatives if we installed a specific version
          if [ "$INSTALLED_VERSION" != "default" ] && [ "$INSTALLED_VERSION" != "" ]; then
            sudo update-alternatives --remove-all clang 2>/dev/null || true
            sudo update-alternatives --remove-all clang++ 2>/dev/null || true
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-$INSTALLED_VERSION 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-$INSTALLED_VERSION 100
            sudo update-alternatives --set clang /usr/bin/clang-$INSTALLED_VERSION
            sudo update-alternatives --set clang++ /usr/bin/clang++-$INSTALLED_VERSION
          fi
          echo "=== Clang version check ==="
          which clang
          which clang++
          clang --version
          clang++ --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake

      - name: Install LLVM (macOS, llvm builds)
        if: runner.os == 'macOS' && matrix.compiler == 'llvm'
        run: |
          brew update
          brew install llvm
          LLVM_PATH="$(brew --prefix llvm)"
          # Add to GITHUB_PATH for subsequent steps
          echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          # Set env vars for subsequent steps
          echo "CC=${LLVM_PATH}/bin/clang" >> $GITHUB_ENV
          echo "CXX=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV
          # Force using Homebrew LLVM's libc++ headers (needed for <stacktrace> on macOS).
          echo "CPPFLAGS=-I${LLVM_PATH}/include -isystem ${LLVM_PATH}/include/c++/v1" >> $GITHUB_ENV
          # Link against Homebrew LLVM's libc++ + unwind (some C++23 facilities may depend on unwind).
          echo "LDFLAGS=-L${LLVM_PATH}/lib -L${LLVM_PATH}/lib/c++ -L${LLVM_PATH}/lib/unwind -lunwind -Wl,-rpath,${LLVM_PATH}/lib/c++ -Wl,-rpath,${LLVM_PATH}/lib/unwind" >> $GITHUB_ENV

          # Update current shell PATH to verify immediately
          export PATH="${LLVM_PATH}/bin:$PATH"
          echo "=== LLVM version check (Immediate) ==="
          which clang
          which clang++
          clang --version
          clang++ --version
          echo "=== Clang version check ==="

      - name: Download subprojects (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          meson subprojects download gtest

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Using Meson WrapDB to provide googletest."

      - name: Install googletest (Meson wrap, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          meson subprojects download gtest

      - name: Install LLVM (Windows, clang-cl builds)
        if: runner.os == 'Windows' && matrix.compiler == 'clang-cl'
        run: |
          choco install llvm -y
          echo "C:\\Program Files\\LLVM\\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure Meson (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BUILDDIR="builddir-${{ matrix.name }}"
          if [ "${{ matrix.compiler }}" = "llvm" ]; then
            LLVM_PREFIX=$(brew --prefix llvm)
            export CC="$LLVM_PREFIX/bin/clang"
            export CXX="$LLVM_PREFIX/bin/clang++"
            # Homebrew LLVM on macOS can end up mixing stdlib settings.
            # Force libc++ to avoid missing libc++ symbols at link time (e.g. std::__1::__hash_memory).
            # Critical: prefer Homebrew LLVM libc++ headers (contains <stacktrace> on supported versions).
            export CXXFLAGS="${CXXFLAGS-} -stdlib=libc++ -I$LLVM_PREFIX/include -isystem $LLVM_PREFIX/include/c++/v1"
            # Link: add libc++ + unwind search paths (some platforms require explicit unwind).
            export LDFLAGS="${LDFLAGS-} -stdlib=libc++ -L$LLVM_PREFIX/lib -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind -Wl,-rpath,$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/unwind"
          elif [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi
          meson setup "${BUILDDIR}" --buildtype=debug -Ddisplay=false

      - name: Configure Meson (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builddir = "builddir-${{ matrix.name }}"
          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            $env:CC = "clang-cl"
            $env:CXX = "clang-cl"
          } else {
            Remove-Item Env:CC -ErrorAction SilentlyContinue
            Remove-Item Env:CXX -ErrorAction SilentlyContinue
          }
          meson setup $builddir --buildtype=debug -Dcpp_std=vc++latest -Ddisplay=false

      - name: Build (tests only) (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: meson compile -C "builddir-${{ matrix.name }}" tests/hahaha_tests

      - name: Build (tests only) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: meson compile -C "builddir-${{ matrix.name }}" tests/hahaha_tests

      - name: Run tests (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: meson test -C "builddir-${{ matrix.name }}" -v --no-rebuild

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: meson test -C "builddir-${{ matrix.name }}" -v --no-rebuild

  cmake-build-and-test:
    name: cmake-${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64-gcc
            runs_on: ubuntu-24.04
            os: linux
          - name: macos-arm64
            runs_on: macos-latest
            os: macos
          - name: windows-x64-msvc
            runs_on: windows-2022
            os: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install cmake ninja

      - name: Install Ninja (Windows, pip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Download wrap dependencies (no Meson) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/fetch_wrap_deps.py --all

      - name: Download wrap dependencies (no Meson) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python dev/fetch_wrap_deps.py --all

      - name: Configure CMake (headless) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "build-cmake-${{ matrix.name }}" -G Ninja \
            -DHAHAHA_DISPLAY=OFF \
            -DHAHAHA_BUILD_TESTS=ON \
            -DHAHAHA_BUILD_EXAMPLES=ON

      - name: Configure CMake (headless) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B "build-cmake-${{ matrix.name }}" -G Ninja `
            -DHAHAHA_DISPLAY=OFF `
            -DHAHAHA_BUILD_TESTS=ON `
            -DHAHAHA_BUILD_EXAMPLES=ON

      - name: Build (CMake) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "build-cmake-${{ matrix.name }}" --parallel 2

      - name: Build (CMake) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "build-cmake-${{ matrix.name }}" --parallel 2

      - name: Run tests (CTest) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "build-cmake-${{ matrix.name }}" -V

      - name: Run tests (CTest) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir "build-cmake-${{ matrix.name }}" -V
