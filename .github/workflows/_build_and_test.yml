name: _build_and_test

on:
  workflow_call:

jobs:
  cmake-build-and-test:
    name: cmake-${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64-gcc
            runs_on: ubuntu-24.04
            os: linux
            compiler: gcc
            triplet: x64-linux
          - name: ubuntu-x64-clang
            runs_on: ubuntu-24.04
            os: linux
            compiler: clang
            triplet: x64-linux
          - name: macos-arm64-llvm
            runs_on: macos-latest
            os: macos
            compiler: llvm
            triplet: arm64-osx
          - name: windows-x64-msvc
            runs_on: windows-2022
            os: windows
            compiler: msvc
            triplet: x64-windows-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev libgl1-mesa-dev

      - name: Install Clang (Linux, clang builds)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          wget -O /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo cp /tmp/llvm-snapshot.gpg.key /etc/apt/trusted.gpg.d/llvm-snapshot.asc
          if echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/llvm.list 2>/dev/null; then
            echo "deb-src http://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee -a /etc/apt/sources.list.d/llvm.list
          else
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy main" | sudo tee /etc/apt/sources.list.d/llvm.list
            echo "deb-src http://apt.llvm.org/jammy/ llvm-toolchain-jammy main" | sudo tee -a /etc/apt/sources.list.d/llvm.list
          fi
          sudo apt-get update
          INSTALLED_VERSION=""
          if apt-cache show clang-20 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-20; then
            INSTALLED_VERSION="20"
          elif apt-cache show clang-19 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-19; then
            INSTALLED_VERSION="19"
          elif apt-cache show clang-18 >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends clang-18; then
            INSTALLED_VERSION="18"
          else
            sudo apt-get install -y --no-install-recommends clang
            INSTALLED_VERSION="default"
          fi
          if [ "$INSTALLED_VERSION" != "default" ] && [ -n "$INSTALLED_VERSION" ]; then
            sudo update-alternatives --remove-all clang 2>/dev/null || true
            sudo update-alternatives --remove-all clang++ 2>/dev/null || true
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-$INSTALLED_VERSION 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-$INSTALLED_VERSION 100
            sudo update-alternatives --set clang /usr/bin/clang-$INSTALLED_VERSION
            sudo update-alternatives --set clang++ /usr/bin/clang++-$INSTALLED_VERSION
          fi
          clang --version
          clang++ --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install cmake ninja

      - name: Install LLVM (macOS, llvm builds)
        if: runner.os == 'macOS' && matrix.compiler == 'llvm'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm
          LLVM_PATH="$(brew --prefix llvm)"
          echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          echo "CC=${LLVM_PATH}/bin/clang" >> $GITHUB_ENV
          echo "CXX=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${LLVM_PATH}/include -isystem ${LLVM_PATH}/include/c++/v1" >> $GITHUB_ENV
          echo "LDFLAGS=-L${LLVM_PATH}/lib -L${LLVM_PATH}/lib/c++ -L${LLVM_PATH}/lib/unwind -lunwind -Wl,-rpath,${LLVM_PATH}/lib/c++ -Wl,-rpath,${LLVM_PATH}/lib/unwind" >> $GITHUB_ENV

      - name: Install Ninja (Windows, pip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Setup vcpkg (clone + bootstrap)
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ -f "$VCPKG_ROOT/vcpkg" ] || [ -f "$VCPKG_ROOT/vcpkg.exe" ]; then
            echo "vcpkg binary already present"
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            else
              "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi

      - name: Fetch vcpkg baseline (manifest builtin-baseline)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          BASELINE=$(python -c "import json; print(json.load(open('vcpkg.json')).get('builtin-baseline',''))" 2>/dev/null || true)
          if [ -n "$BASELINE" ]; then
            git -C "$VCPKG_ROOT" fetch origin "$BASELINE" || git -C "$VCPKG_ROOT" fetch --unshallow origin || true
          fi

      - name: Install dependencies via vcpkg (manifest mode)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          TRIPLET="${{ matrix.triplet }}"
          export VCPKG_ROOT
          if [ ! -f vcpkg.json ]; then
            echo "error: vcpkg.json not found in $(pwd)"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/vcpkg.exe" install --triplet "$TRIPLET"
          else
            "$VCPKG_ROOT/vcpkg" install --triplet "$TRIPLET"
          fi

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          export VCPKG_ROOT
          export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang
            export CXX=clang++
            # FindThreads with Clang on Linux: pre-set so CMake skips broken try_compile; add -pthread for link
            cmake -S . -B "build-cmake-${{ matrix.name }}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-pthread" \
              -DCMAKE_EXE_LINKER_FLAGS="-pthread" \
              -DCMAKE_SHARED_LINKER_FLAGS="-pthread" \
              -DCMAKE_THREAD_LIBS_INIT="-pthread" \
              -DCMAKE_HAVE_PTHREAD_H=1 \
              -DHAHAHA_DISPLAY=OFF \
              -DHAHAHA_BUILD_TESTS=ON \
              -DHAHAHA_BUILD_EXAMPLES=ON
          else
            cmake -S . -B "build-cmake-${{ matrix.name }}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DHAHAHA_DISPLAY=OFF \
              -DHAHAHA_BUILD_TESTS=ON \
              -DHAHAHA_BUILD_EXAMPLES=ON
          fi

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg\vcpkg_root"
          $env:CMAKE_TOOLCHAIN_FILE = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B "build-cmake-${{ matrix.name }}" -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DHAHAHA_DISPLAY=OFF `
            -DHAHAHA_BUILD_TESTS=ON `
            -DHAHAHA_BUILD_EXAMPLES=ON

      - name: Build (CMake) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "build-cmake-${{ matrix.name }}" --parallel 2

      - name: Build (CMake) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "build-cmake-${{ matrix.name }}" --parallel 2

      - name: Run tests (CTest) (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "build-cmake-${{ matrix.name }}" -V

      - name: Run tests (CTest) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir "build-cmake-${{ matrix.name }}" -V
