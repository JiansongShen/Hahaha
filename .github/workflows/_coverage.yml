name: _coverage

on:
  workflow_call:

jobs:
  coverage:
    name: coverage (core line>=80, branch>=35; exclude display)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install build deps and gcovr (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            gcovr \
            libgl1-mesa-dev libglfw3-dev

      - name: Setup vcpkg (clone + bootstrap)
        run: |
          set -euo pipefail
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ ! -f "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Fetch vcpkg baseline (manifest builtin-baseline)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          BASELINE=$(python -c "import json; print(json.load(open('vcpkg.json')).get('builtin-baseline',''))" 2>/dev/null || true)
          if [ -n "$BASELINE" ]; then
            git -C "$VCPKG_ROOT" fetch origin "$BASELINE" || git -C "$VCPKG_ROOT" fetch --unshallow origin || true
          fi

      - name: Install dependencies via vcpkg (manifest mode)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          export VCPKG_ROOT
          if [ ! -f vcpkg.json ]; then
            echo "error: vcpkg.json not found in $(pwd)"
            exit 1
          fi
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux

      - name: Run coverage (coverage.sh with vcpkg env)
        run: |
          set -euo pipefail
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg/vcpkg_root"
          bash dev/coverage.sh builddir-coverage --no-cuda
