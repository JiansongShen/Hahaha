name: _coverage

on:
  workflow_call:

jobs:
  coverage:
    name: coverage (core line>=80, branch>=35; exclude display)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Ninja (pip)
        run: python -m pip install --upgrade pip && python -m pip install ninja

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gcovr \
            libgl1-mesa-dev libglfw3-dev

      - name: Setup vcpkg + install googletest (Linux)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "vcpkg/vcpkg_root" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg/vcpkg_root
          fi
          ./vcpkg/vcpkg_root/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg_root/vcpkg install gtest --triplet x64-linux

      - name: Run coverage gates
        run: bash dev/coverage.sh builddir-coverage
