name: CI

on:
  push:
    branches: [ dev, main, project-structure-optimize ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64) - GCC
          - name: ubuntu-x64-gcc
            runs_on: ubuntu-24.04
            os: linux
            arch: x64
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux (x86_64) - Clang
          - name: ubuntu-x64-clang
            runs_on: ubuntu-24.04
            os: linux
            arch: x64
            compiler: clang
            cc: clang
            cxx: clang++

          # Linux (ARM64) - GCC (GitHub-hosted ARM runners are in public preview.)
          - name: ubuntu-arm64-gcc
            runs_on: ubuntu-24.04-arm
            os: linux
            arch: arm64
            compiler: gcc
            cc: gcc
            cxx: g++

          # Linux (ARM64) - Clang
          - name: ubuntu-arm64-clang
            runs_on: ubuntu-24.04-arm
            os: linux
            arch: arm64
            compiler: clang
            cc: clang
            cxx: clang++

          # macOS (x86_64) - AppleClang
          - name: macos-x64-appleclang
            runs_on: macos-15-intel
            os: macos
            arch: x64
            compiler: appleclang
            cc: clang
            cxx: clang++

          # macOS (x86_64) - Homebrew LLVM Clang
          - name: macos-x64-llvm
            runs_on: macos-15-intel
            os: macos
            arch: x64
            compiler: llvm
            cc: llvm
            cxx: llvm

          # macOS (ARM64, Apple Silicon) - AppleClang
          - name: macos-arm64-appleclang
            runs_on: macos-latest
            os: macos
            arch: arm64
            compiler: appleclang
            cc: clang
            cxx: clang++

          # macOS (ARM64, Apple Silicon) - Homebrew LLVM Clang
          - name: macos-arm64-llvm
            runs_on: macos-latest
            os: macos
            arch: arm64
            compiler: llvm
            cc: llvm
            cxx: llvm

          # Windows (x86_64) - MSVC (cl)
          - name: windows-x64-msvc
            runs_on: windows-2022
            os: windows
            arch: x64
            compiler: msvc
            cc: ""
            cxx: ""

          # Windows (x86_64) - clang-cl
          - name: windows-x64-clangcl
            runs_on: windows-2022
            os: windows
            arch: x64
            compiler: clang-cl
            cc: clang-cl
            cxx: clang-cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja (pip)
        run: python -m pip install --upgrade pip && python -m pip install meson ninja

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtest-dev \
            libgl1-mesa-dev libglfw3-dev
          # Ubuntu ships googletest sources via libgtest-dev; build & install libs.
          if [ -d "/usr/src/googletest" ]; then
            GTEST_SRC="/usr/src/googletest"
          else
            GTEST_SRC="/usr/src/gtest"
          fi
          sudo cmake -S "$GTEST_SRC" -B /tmp/gtest-build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/gtest-build --target install -j2
          sudo ldconfig

      - name: Install Clang (Linux, clang builds)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake googletest
          echo "CMAKE_PREFIX_PATH=$(brew --prefix googletest)" >> $GITHUB_ENV

      - name: Install LLVM (macOS, llvm builds)
        if: runner.os == 'macOS' && matrix.compiler == 'llvm'
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Using vcpkg to install googletest"
          vcpkg install gtest:x64-windows
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT\\installed\\x64-windows" >> $env:GITHUB_ENV

      - name: Install LLVM (Windows, clang-cl builds)
        if: runner.os == 'Windows' && matrix.compiler == 'clang-cl'
        run: |
          choco install llvm -y
          echo "C:\\Program Files\\LLVM\\bin" >> $env:GITHUB_PATH

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure Meson (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BUILDDIR="builddir-${{ matrix.name }}"
          if [ "${{ matrix.compiler }}" = "llvm" ]; then
            export CC="$(brew --prefix llvm)/bin/clang"
            export CXX="$(brew --prefix llvm)/bin/clang++"
          elif [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi

          echo "Compiler selection:"
          echo "  matrix.compiler=${{ matrix.compiler }}"
          echo "  CC=${CC-}"
          echo "  CXX=${CXX-}"

          meson setup "${BUILDDIR}" --buildtype=debug

      - name: Configure Meson (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $builddir = "builddir-${{ matrix.name }}"

          # Avoid Git-Bash toolchain collisions on Windows.
          # Ensure we use MSVC/clang-cl toolchain from msvc-dev-cmd environment.

          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            $env:CC = "clang-cl"
            $env:CXX = "clang-cl"
          } else {
            Remove-Item Env:CC -ErrorAction SilentlyContinue
            Remove-Item Env:CXX -ErrorAction SilentlyContinue
          }

          Write-Host "Compiler selection:"
          Write-Host "  matrix.compiler=${{ matrix.compiler }}"
          Write-Host "  CC=$env:CC"
          Write-Host "  CXX=$env:CXX"

          # Meson on MSVC/clang-cl uses vc++* dialect names; vc++latest maps to
          # the newest language mode available.
          meson setup $builddir --buildtype=debug -Dcpp_std=vc++latest

      - name: Build (tests only) (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: meson compile -C "builddir-${{ matrix.name }}" tests/hahaha_tests

      - name: Build (tests only) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: meson compile -C "builddir-${{ matrix.name }}" tests/hahaha_tests

      - name: Run tests (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: meson test -C "builddir-${{ matrix.name }}" -v --no-rebuild

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: meson test -C "builddir-${{ matrix.name }}" -v --no-rebuild

  coverage:
    name: coverage (core line>=70, branch>=50; exclude display)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Meson and Ninja (pip)
        run: python -m pip install --upgrade pip && python -m pip install meson ninja

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtest-dev gcovr \
            libgl1-mesa-dev libglfw3-dev
          # Ubuntu ships googletest sources via libgtest-dev; build & install libs.
          if [ -d "/usr/src/googletest" ]; then
            GTEST_SRC="/usr/src/googletest"
          else
            GTEST_SRC="/usr/src/gtest"
          fi
          sudo cmake -S "$GTEST_SRC" -B /tmp/gtest-build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/gtest-build --target install -j2
          sudo ldconfig

      - name: Run coverage gates
        run: bash dev/coverage.sh builddir-coverage
